services:
  proton-backup:
    build:
      context: .
      args:
        PROTON_CLI_VERSION: "0.9.0"
        PROTON_CLI_PLATFORM: "linux-x64"
    container_name: proton-backup
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      BACKUP_TIME: ${BACKUP_TIME} # daily, HH:MM in TZ
      REMOTE_DIR: ${REMOTE_DIR} # must already exist in Proton Drive
      BACKUP_NAME: ${BACKUP_NAME} # prefix; run folder is <name>_YYYY-MM-DD_HHMMSS
      RUN_ON_START: ${RUN_ON_START} # true = also back up at container start
    volumes:
      - ./proton-session:/data # CLI session lives here
      - ./staging:/staging # temp space for archives


      # ---- What to back up: one archive per folder under /source/<name> ----
      # - /opt/docker/vaultwarden:/source/vaultwarden:ro
      # Named volumes (declare them under `volumes:` below as external):
      # - immich_pgdata:/source/immich-db:ro

# volumes:
#  immich_pgdata:
#   external: true
#   name: immich_pgdata   # exact name from `docker volume ls`
