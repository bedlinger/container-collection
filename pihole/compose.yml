services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8000:80/tcp"
      - "3344:443/tcp"
      - "6767:67/udp"
      - "1234:123/udp"
    environment:
      - TZ=Europe/Vienna
      - FTLCONF_webserver_api_password=${WEB_API_PASSWD}
      - FTLCONF_dns_listeningMode=LOCAL
    volumes:
      - "./etc-pihole:/etc/pihole"
    cap_add:
      # See https://docs.pi-hole.net/docker/#note-on-capabilities
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    network_mode: host
    labels:
      - docker-volume-backup.stop-during-backup=false

  pihole-backup:
    image: offen/docker-volume-backup:latest
    container_name: pihole-backup
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "@daily"
      BACKUP_JITTER: "30s"
      BACKUP_FILENAME: "BACKUP-pihole-%Y-%m-%dT%H-%M-%S.{{ .Extension }}"
      BACKUP_RETENTION_DAYS: "3"
      BACKUP_PRUNING_PREFIX: "BACKUP-"
      NOTIFICATION_URLS: ${NOTIFICATION_URLS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./etc-pihole:/backup/pihole/data:ro
      - ./pihole-backup:/archive
